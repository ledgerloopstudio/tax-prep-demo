<!DOCTYPE html>
<html lang="en" data-theme="vault" data-font="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121926">
<title>Tax Prep Checklist — Ledger Vault (Free Demo)</title>
<style>
/* ================= LEDGER VAULT · quiet-luxury fintech ================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--radius:14px;--radius-s:10px}

/* --- themes: 2 dark, 2 light --- */
[data-theme="vault"]{
  --bg:#121926;--bg-soft:#0e141f;--surface:#1c2536;--surface-2:#243049;--surface-3:#2d3b58;
  --text:#eef1f6;--muted:#a6b0c2;--faint:#6f7a92;
  --accent:#c9a227;--accent-2:#a8861f;--accent-ink:#1a1405;
  --line:rgba(238,241,246,.10);--line-strong:rgba(238,241,246,.22);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.38);
  --shadow-s:0 1px 2px rgba(0,0,0,.35),0 6px 16px rgba(0,0,0,.28);
  --good:#7fd08f;--bad:#e5856a;--warn:#d9b545;--info:#8fb2dd;
  --glow:0 0 0 3px rgba(201,162,39,.20);
}
[data-theme="midnight"]{
  --bg:#0a0f1c;--bg-soft:#070b14;--surface:#111a2e;--surface-2:#16213a;--surface-3:#1d2a48;
  --text:#e9edf5;--muted:#9aa6bf;--faint:#626d88;
  --accent:#d4af37;--accent-2:#b08d24;--accent-ink:#171204;
  --line:rgba(233,237,245,.09);--line-strong:rgba(233,237,245,.20);
  --shadow:0 1px 2px rgba(0,0,0,.55),0 14px 34px rgba(0,0,0,.45);
  --shadow-s:0 1px 2px rgba(0,0,0,.45),0 6px 16px rgba(0,0,0,.35);
  --good:#7fd08f;--bad:#e5856a;--warn:#d4af37;--info:#8fb2dd;
  --glow:0 0 0 3px rgba(212,175,55,.20);
}
[data-theme="ledger"]{
  --bg:#eceff4;--bg-soft:#e3e7ee;--surface:#ffffff;--surface-2:#f3f5f9;--surface-3:#e8ecf3;
  --text:#1e293b;--muted:#5b6b84;--faint:#8b97ab;
  --accent:#a8842a;--accent-2:#8a6d22;--accent-ink:#ffffff;
  --line:rgba(30,41,59,.12);--line-strong:rgba(30,41,59,.24);
  --shadow:0 1px 2px rgba(30,41,59,.10),0 14px 34px rgba(30,41,59,.12);
  --shadow-s:0 1px 2px rgba(30,41,59,.08),0 6px 16px rgba(30,41,59,.10);
  --good:#2c7a46;--bad:#ad4028;--warn:#a8842a;--info:#35689b;
  --glow:0 0 0 3px rgba(168,132,42,.18);
}
[data-theme="alabaster"]{
  --bg:#f4f1ea;--bg-soft:#ece7da;--surface:#fffdf8;--surface-2:#f6f2e8;--surface-3:#ede6d4;
  --text:#232c3d;--muted:#66707f;--faint:#96917f;
  --accent:#9c7c24;--accent-2:#7f6419;--accent-ink:#fffdf8;
  --line:rgba(35,44,61,.12);--line-strong:rgba(35,44,61,.24);
  --shadow:0 1px 2px rgba(74,62,30,.10),0 14px 34px rgba(74,62,30,.12);
  --shadow-s:0 1px 2px rgba(74,62,30,.08),0 6px 16px rgba(74,62,30,.10);
  --good:#2c7a46;--bad:#ad4028;--warn:#9c7c24;--info:#35689b;
  --glow:0 0 0 3px rgba(156,124,36,.18);
}

/* --- fonts: 3 pairings, system stacks only --- */
[data-font="serif"]{--font-display:"Iowan Old Style",Georgia,"Times New Roman",serif;--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
[data-font="grotesk"]{--font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
[data-font="humanist"]{--font-display:"Avenir Next","Segoe UI","Trebuchet MS",Verdana,sans-serif;--font-body:"Avenir Next","Segoe UI","Trebuchet MS",Verdana,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.55;min-height:100vh;
  background-image:radial-gradient(1200px 520px at 85% -10%,rgba(201,162,39,.06),transparent 60%)}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums lining-nums}
a{color:var(--accent)}
::selection{background:rgba(201,162,39,.30)}

/* ---------- header ---------- */
.app-header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;background:rgba(18,25,38,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
[data-theme="ledger"] .app-header,[data-theme="alabaster"] .app-header{background:rgba(255,255,255,.80)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--shadow-s)}
.brand-mark svg{width:22px;height:22px}
.brand h1{font-size:19px;line-height:1.2}
.brand small{display:block;font-family:var(--font-body);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:600}
.header-actions{display:flex;align-items:center;gap:10px}
.theme-mode{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
  display:grid;place-items:center;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-s);border-color:var(--accent)}
.icon-btn svg{width:19px;height:19px}

/* ---------- nav ---------- */
#mainNav{position:sticky;top:67px;z-index:40;display:flex;gap:8px;overflow-x:auto;padding:12px 22px;
  background:rgba(18,25,38,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);scrollbar-width:none}
[data-theme="ledger"] #mainNav,[data-theme="alabaster"] #mainNav{background:rgba(255,255,255,.80)}
#mainNav::-webkit-scrollbar{display:none}
#mainNav button{flex:0 0 auto;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:.02em;
  padding:9px 15px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);cursor:pointer;
  transition:all .18s ease;white-space:nowrap}
#mainNav button:hover{color:var(--text);border-color:var(--accent)}
#mainNav button.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);
  box-shadow:var(--shadow-s)}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:26px 22px 90px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.view-head h2{font-size:27px}
.view-head p{color:var(--muted);font-size:14px;max-width:640px;margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-s)}
.card h3{font-size:17px;margin-bottom:6px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-s);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent)}
.stat .label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat .value{font-family:var(--font-display);font-size:29px;font-weight:600;line-height:1.15}
.stat .hint{font-size:12.5px;color:var(--faint);margin-top:6px}

/* ---------- progress ---------- */
.progress{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative}
.progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .5s ease}
.progress-row{display:flex;align-items:center;gap:12px;margin-top:8px}
.progress-row .pct{font-size:13px;font-weight:700;color:var(--accent);min-width:44px;text-align:right}

/* ---------- forms ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.field .opt{font-size:11px;color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0}
.input,select.input,textarea.input{width:100%;padding:12px 14px;border-radius:var(--radius-s);border:1px solid var(--line-strong);
  background:var(--bg-soft);color:var(--text);font-family:var(--font-body);font-size:15px;transition:border-color .15s,box-shadow .15s}
textarea.input{resize:vertical;min-height:84px}
.input:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow)}
select.input{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23a6b0c2' stroke-width='2' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center}
input[type="date"].input,input[type="number"].input{color-scheme:light}
[data-theme="vault"] input[type="date"].input,[data-theme="vault"] input[type="number"].input,
[data-theme="midnight"] input[type="date"].input,[data-theme="midnight"] input[type="number"].input{color-scheme:dark}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-body);font-size:14px;font-weight:700;
  padding:12px 20px;border-radius:var(--radius-s);border:1px solid transparent;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);box-shadow:var(--shadow-s)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-danger{background:transparent;border-color:rgba(229,133,106,.5);color:var(--bad)}
.btn-danger:hover{background:rgba(229,133,106,.12)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}

/* custom checkbox */
.check{display:flex;align-items:flex-start;gap:13px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--bg-soft);cursor:pointer;transition:border-color .15s,background .15s}
.check:hover{border-color:var(--line-strong)}
.check.done{background:rgba(201,162,39,.07);border-color:rgba(201,162,39,.35)}
.box{flex:none;width:23px;height:23px;border-radius:7px;border:2px solid var(--line-strong);margin-top:1px;display:grid;place-items:center;
  transition:all .18s ease;background:var(--surface)}
.box svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:all .18s ease}
.check.done .box{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent}
.check.done .box svg{opacity:1;transform:scale(1)}
.check .t{flex:1}
.check .t strong{display:block;font-size:14.5px;font-weight:600}
.check.done .t strong{text-decoration:line-through;color:var(--muted)}
.check .t small{color:var(--faint);font-size:12.5px}
.due-pill{flex:none;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted)}
.due-pill.overdue{color:var(--bad);border-color:rgba(229,133,106,.5)}
.due-pill.soon{color:var(--warn);border-color:rgba(217,181,69,.5)}

/* toggle switch */
.switch{position:relative;width:46px;height:26px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;border-radius:999px;background:var(--surface-3);border:1px solid var(--line-strong);transition:all .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:all .2s}
.switch input:checked + .track{background:rgba(201,162,39,.25);border-color:var(--accent)}
.switch input:checked + .track .knob{left:23px;background:var(--accent)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-s)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  padding:11px 14px;border-bottom:1px solid var(--line-strong);background:var(--bg-soft);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(201,162,39,.04)}
td.r,th.r{text-align:right}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.mini-btn{font-size:12px;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface-2);color:var(--text);cursor:pointer;transition:all .15s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.del:hover{border-color:var(--bad);color:var(--bad)}
.empty{padding:34px 20px;text-align:center;color:var(--faint);font-size:14px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line-strong);cursor:zoom-in}

/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(5,8,14,.62);backdrop-filter:blur(4px);z-index:100;display:none;
  align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.modal-back.open{display:flex}
.modal{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line-strong);border-radius:18px;
  box-shadow:var(--shadow);padding:26px;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:20px;margin-bottom:4px}
.modal .sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);z-index:200;background:var(--surface);
  border:1px solid var(--accent);color:var(--text);padding:13px 22px;border-radius:12px;box-shadow:var(--shadow);
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- finder ---------- */
.stepper{display:flex;gap:6px;margin-bottom:20px}
.stepper i{flex:1;height:6px;border-radius:999px;background:var(--surface-3)}
.stepper i.on{background:linear-gradient(90deg,var(--accent-2),var(--accent))}
.qa-card{text-align:center;padding:34px 26px}
.qa-card h3{font-size:22px;margin-bottom:8px}
.qa-card p{color:var(--muted);margin-bottom:24px}
.yn{display:flex;gap:14px;justify-content:center}
.yn .btn{padding:14px 44px;font-size:16px}
.finder-item{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:var(--radius-s);
  background:var(--bg-soft);margin-bottom:12px}
.finder-item .n{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink)}

/* ---------- payer cards ---------- */
.payer{display:flex;gap:16px;align-items:flex-start;padding:18px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);box-shadow:var(--shadow-s);margin-bottom:14px}
.payer .avatar{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--font-display);
  font-weight:700;font-size:18px;background:var(--surface-3);color:var(--accent);border:1px solid var(--line-strong)}
.payer .info{flex:1}
.payer .info strong{font-size:16px}
.payer .meta{color:var(--muted);font-size:13px;margin-top:2px}
.recv-pill{flex:none;font-size:12px;font-weight:800;letter-spacing:.06em;padding:7px 13px;border-radius:999px}
.recv-pill.yes{background:rgba(127,208,143,.16);color:var(--good);border:1px solid rgba(127,208,143,.4)}
.recv-pill.no{background:rgba(229,133,106,.12);color:var(--bad);border:1px solid rgba(229,133,106,.4)}

/* ---------- misc ---------- */
.group-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.group-title:first-child{margin-top:0}
.group-title h3{font-size:16px}
.group-title .count{font-size:12px;font-weight:700;color:var(--muted)}
.disclaimer{border:1px solid rgba(217,181,69,.4);background:rgba(217,181,69,.08);border-radius:var(--radius-s);
  padding:14px 16px;font-size:13px;color:var(--muted);margin-top:18px}
.disclaimer strong{color:var(--warn)}
.footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.theme-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:560px){.theme-pick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.swatch{border:2px solid var(--line-strong);border-radius:var(--radius-s);overflow:hidden;cursor:pointer;background:var(--surface)}
.swatch.sel{border-color:var(--accent);box-shadow:var(--glow)}
.swatch .chip{height:64px}
.swatch .nm{padding:9px;font-size:13px;font-weight:700;text-align:center}
.font-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.font-pick{grid-template-columns:1fr}}
.font-opt{border:2px solid var(--line-strong);border-radius:var(--radius-s);padding:16px;cursor:pointer;background:var(--surface)}
.font-opt.sel{border-color:var(--accent);box-shadow:var(--glow)}
.font-opt .demo{font-size:19px;margin-bottom:4px}
.font-opt small{color:var(--faint)}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv b{font-variant-numeric:tabular-nums}
.cat-bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.cat-bar .nm{width:150px;flex:none;font-size:13px;font-weight:600;text-transform:capitalize}
.cat-bar .progress{flex:1}
.cat-bar .amt{width:90px;flex:none;text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.countdown{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1}
.countdown small{font-size:14px;font-family:var(--font-body);color:var(--muted)}
/* self-test */
.test-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.test-row .badge{flex:none;font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 12px;border-radius:999px}
.badge.pass{background:rgba(127,208,143,.16);color:var(--good);border:1px solid rgba(127,208,143,.4)}
.badge.fail{background:rgba(229,133,106,.16);color:var(--bad);border:1px solid rgba(229,133,106,.4)}
.test-row .detail{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<!-- ===== LEDGERLOOPSTUDIO DEMO BAR ===== -->

  <span style="margin-right:6px;">&#127876;</span> FREE DEMO &mdash; LedgerLoopStudio

<script>
"use strict";
/* ================= LEDGER VAULT · app logic ================= */
const $ = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const money = n => "$" + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const int0 = n => Number(n || 0).toLocaleString("en-US");
const fmtDate = iso => {
  if (!iso) return "—";
  const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? "—" : d.toLocaleDateString("en-US", {month: "short", day: "numeric", year: "numeric"});
};
const todayISO = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
};
const daysBetween = (a, b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000);

let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------------- storage ---------------- */
const STORE_KEY = "ledgerloop.taxPrepChecklist.v1";
const CATEGORIES = ["home office","vehicle","software","supplies","travel","meals","education","health","professional services","other"];
const CHECKLIST_GROUPS = ["Income documents","Deductions","Mileage records","Quarterly payments","Filing"];

function defaultChecklist(taxYear){
  const t = [
    ["Income documents","Collect all W-2 forms from employers", taxYear+"-01-31"],
    ["Income documents","Collect 1099-NEC / 1099-MISC forms from every payer", taxYear+"-01-31"],
    ["Income documents","Gather bank and brokerage year-end statements", taxYear+"-02-15"],
    ["Income documents","Record any crypto or investment sales", taxYear+"-02-15"],
    ["Deductions","Organize and total business receipts", taxYear+"-03-01"],
    ["Deductions","Tally home-office expenses", taxYear+"-03-01"],
    ["Deductions","Compile charitable donation records", taxYear+"-03-01"],
    ["Deductions","Summarize health insurance premiums paid", taxYear+"-03-01"],
    ["Mileage records","Export mileage log for the full year", taxYear+"-02-28"],
    ["Mileage records","Separate business miles from personal miles", taxYear+"-02-28"],
    ["Quarterly payments","Confirm all four estimated payments were made", taxYear+"-01-31"],
    ["Quarterly payments","Record payment amounts and confirmation numbers", taxYear+"-01-31"],
    ["Filing","Choose filing method — DIY software or tax professional", taxYear+"-03-15"],
    ["Filing","File return or file an extension", taxYear+"-04-15"],
    ["Filing","Store filed copies and supporting documents securely", taxYear+"-04-30"],
  ];
  return t.map(x => ({id: uid()+Math.random().toString(36).slice(2,6), group: x[0], label: x[1], due: x[2], done: false, custom: false}));
}

function seedData(){
  const Y = new Date().getFullYear();
  return {
    version: 1,
    seeded: true,
    settings: {theme: "vault", font: "serif", taxYear: Y},
    checklist: defaultChecklist(Y),
    deductions: [
      {id: uid()+"a", date: Y+"-02-12", category: "software", amount: 348.00, bizPct: 100, note: "Accounting software annual plan", receipt: null},
      {id: uid()+"b", date: Y+"-03-05", category: "home office", amount: 129.99, bizPct: 100, note: "Ergonomic desk chair (business use)", receipt: null},
      {id: uid()+"c", date: Y+"-04-18", category: "education", amount: 199.00, bizPct: 100, note: "Advanced bookkeeping course", receipt: null},
      {id: uid()+"d", date: Y+"-05-22", category: "travel", amount: 486.40, bizPct: 100, note: "Client site visit — flight + hotel", receipt: null},
      {id: uid()+"e", date: Y+"-06-09", category: "professional services", amount: 275.00, bizPct: 100, note: "CPA consultation", receipt: null},
      {id: uid()+"f", date: Y+"-07-14", category: "vehicle", amount: 62.30, bizPct: 80, note: "Fuel — client meetings", receipt: null},
    ],
    mileage: [
      {id: uid()+"g", date: Y+"-03-05", miles: 48, purpose: "Client onboarding meeting"},
      {id: uid()+"h", date: Y+"-04-18", miles: 112, purpose: "Conference — venue round trip"},
      {id: uid()+"i", date: Y+"-06-09", miles: 35, purpose: "Supply run"},
    ],
    quarterly: {income: 85000, pct: 25, priorPaid: 12000, paid: [
      {id: uid()+"j", q: "Q1", amount: 5312.50, date: Y+"-04-15"},
      {id: uid()+"k", q: "Q2", amount: 5312.50, date: Y+"-06-15"},
    ]},
    finder: {answers: {}, done: false},
    payers: [
      {id: uid()+"l", name: "Acme Design Co.", formType: "1099-NEC", amount: 18400, received: true, notes: "Received by email Jan 24"},
      {id: uid()+"m", name: "Brightline Media", formType: "1099-NEC", amount: 9250, received: false, notes: "Followed up Feb 2"},
      {id: uid()+"n", name: "Harbor Consulting", formType: "1099-MISC", amount: 3100, received: false, notes: ""},
    ],
  };
}

let DB = null;
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { DB = JSON.parse(raw); return; }
  } catch(e) { /* corrupted → reseed */ }
  DB = seedData();
  save();
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e) { toast("Storage is full — receipt images may be too large."); }
}
load();

/* ---------------- theming ---------------- */
const THEMES = [
  {id:"vault", name:"Vault", dark:true, chip:"linear-gradient(135deg,#121926 60%,#c9a227)"},
  {id:"midnight", name:"Midnight", dark:true, chip:"linear-gradient(135deg,#0a0f1c 60%,#d4af37)"},
  {id:"ledger", name:"Ledger", dark:false, chip:"linear-gradient(135deg,#ffffff 60%,#a8842a)"},
  {id:"alabaster", name:"Alabaster", dark:false, chip:"linear-gradient(135deg,#fffdf8 60%,#9c7c24)"},
];
const FONTS = [
  {id:"serif", name:"Classic Serif", desc:"Georgia headlines · system sans body"},
  {id:"grotesk", name:"Modern Grotesk", desc:"Clean system sans throughout"},
  {id:"humanist", name:"Warm Humanist", desc:"Avenir-style friendly shapes"},
];
function applySettings(){
  document.documentElement.setAttribute("data-theme", DB.settings.theme);
  document.documentElement.setAttribute("data-font", DB.settings.font);
  const dark = (THEMES.find(t => t.id === DB.settings.theme) || {}).dark;
  $("#modeIconMoon").style.display = dark ? "block" : "none";
  $("#modeIconSun").style.display = dark ? "none" : "block";
}
function toggleDarkLight(){
  const dark = (THEMES.find(t => t.id === DB.settings.theme) || {}).dark;
  DB.settings.theme = dark ? "ledger" : "vault";
  save(); applySettings(); toast(dark ? "Light mode on" : "Dark mode on");
}

/* ---------------- nav + router ---------------- */
const VIEWS = [
  ["dashboard","Dashboard"],["checklist","Checklist"],["deductions","Deductions"],
  ["mileage","Mileage"],["quarterly","Quarterly"],["finder","Finder"],
  ["payers","1099s"],["report","Report"],["settings","Settings"],
];
function buildNav(){
  $("#mainNav").innerHTML = VIEWS.map(v =>
    '<button data-view="'+v[0]+'">'+v[1]+'</button>').join("");
  $$("#mainNav button").forEach(b => b.addEventListener("click", () => { location.hash = "#/" + b.dataset.view; }));
}
function currentView(){
  const h = (location.hash || "").replace("#/","").replace("#","");
  return VIEWS.some(v => v[0] === h) ? h : "dashboard";
}
const RENDER = {};
function render(){
  const v = currentView();
  $$("#mainNav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  const el = $("#view");
  el.innerHTML = "";
  try { el.innerHTML = RENDER[v](); }
  catch(e){ el.innerHTML = '<div class="card"><h3>Something went wrong</h3><p class="sub">This view could not be rendered.</p></div>'; }
  if (BIND[v]) { try { BIND[v](); } catch(e){} }
  window.scrollTo(0, 0);
}
const BIND = {};
window.addEventListener("hashchange", render);

/* ---------------- modal ---------------- */
function openModal(html){
  $("#modalBox").innerHTML = html;
  $("#modalBack").classList.add("open");
  const first = $("#modalBox .input");
  if (first) first.focus();
}
function closeModal(){ $("#modalBack").classList.remove("open"); $("#modalBox").innerHTML = ""; }

/* ---------------- shared bits ---------------- */
const DISCLAIMER_HTML = '<div class="disclaimer"><strong>Informational only — not tax advice.</strong> ' +
  'This app organizes your records and produces estimates from numbers you enter. Tax rules change and vary by situation. ' +
  'Consult a qualified tax professional before filing or making payments.</div>';

function deductionTotal(list){
  return (list || DB.deductions).reduce((s, d) => s + (Number(d.amount) * (Number(d.bizPct == null ? 100 : d.bizPct)) / 100), 0);
}
function mileageTotal(list){
  return (list || DB.mileage).reduce((s, m) => s + Number(m.miles || 0), 0);
}
function quarterlyDueDates(taxYear){
  const Y = Number(taxYear);
  return [
    {q:"Q1", date: Y+"-04-15", label:"Apr 15"},
    {q:"Q2", date: Y+"-06-15", label:"Jun 15"},
    {q:"Q3", date: Y+"-09-15", label:"Sep 15"},
    {q:"Q4", date: (Y+1)+"-01-15", label:"Jan 15"},
  ];
}
function nextDueDate(taxYear){
  const t = todayISO();
  const all = quarterlyDueDates(taxYear).concat(quarterlyDueDates(Number(taxYear)+1));
  for (const d of all) if (d.date >= t) return d;
  return all[all.length-1];
}
function paidTotal(){ return DB.quarterly.paid.reduce((s,p) => s + Number(p.amount||0), 0); }
function estimatedAnnualTax(){
  const q = DB.quarterly;
  if (q.income && q.pct) return Number(q.income) * Number(q.pct) / 100;
  return null;
}
function checklistStats(){
  const t = DB.checklist, done = t.filter(x => x.done).length;
  return {total: t.length, done, pct: t.length ? Math.round(done/t.length*100) : 0};
}
function duePill(due){
  if (!due) return "";
  const diff = daysBetween(todayISO(), due);
  if (diff < 0) return '<span class="due-pill overdue">overdue</span>';
  if (diff <= 14) return '<span class="due-pill soon">'+diff+'d left</span>';
  return '<span class="due-pill">'+fmtDate(due)+'</span>';
}

/* ================= VIEW 1 · Dashboard ================= */
RENDER.dashboard = function(){
  const Y = DB.settings.taxYear;
  const yearStart = Y+"-01-01", yearEnd = Y+"-12-31";
  const totalDays = daysBetween(yearStart, yearEnd) + 1;
  const elapsed = Math.max(0, Math.min(totalDays, daysBetween(yearStart, todayISO()) + 1));
  const remaining = totalDays - elapsed;
  const ypct = Math.round(elapsed / totalDays * 100);
  const nd = nextDueDate(Y);
  const ndays = daysBetween(todayISO(), nd.date);
  const est = estimatedAnnualTax();
  const paid = paidTotal();
  const setAside = est == null ? null : Math.max(0, est - paid);
  const cs = checklistStats();
  const payers = DB.payers, recv = payers.filter(p => p.received).length;

  return '<div class="view-head"><div><h2>Dashboard</h2>' +
    '<p>Your tax year '+esc(Y)+' at a glance — deductions, deadlines, and what is still left to set aside.</p></div>' +
    '<button class="btn btn-ghost btn-sm" data-goto="#/report">Year-End Report</button></div>' +

  '<div class="grid g4" style="margin-bottom:16px">' +
    '<div class="stat"><div class="label">Deductions logged</div><div class="value num">'+money(deductionTotal())+'</div>' +
      '<div class="hint">'+DB.deductions.length+' entries · business-use adjusted</div></div>' +
    '<div class="stat"><div class="label">Business miles</div><div class="value num">'+int0(mileageTotal())+'</div>' +
      '<div class="hint">'+DB.mileage.length+' trips logged</div></div>' +
    '<div class="stat"><div class="label">Checklist progress</div><div class="value num">'+cs.pct+'%</div>' +
      '<div class="hint">'+cs.done+' of '+cs.total+' tasks complete</div></div>' +
    '<div class="stat"><div class="label">1099s received</div><div class="value num">'+recv+' / '+payers.length+'</div>' +
      '<div class="hint">payers confirmed</div></div>' +
  '</div>' +

  '<div class="grid g2">' +
    '<div class="card"><div class="eyebrow">Tax-year progress</div><h3>'+esc(Y)+' · day '+elapsed+' of '+totalDays+'</h3>' +
      '<div class="progress-row"><div class="progress" style="flex:1"><i style="width:'+ypct+'%"></i></div>' +
      '<span class="pct num">'+ypct+'%</span></div>' +
      '<p class="sub" style="margin:10px 0 0">'+remaining+' days remaining in the tax year.</p></div>' +

    '<div class="card"><div class="eyebrow">Next estimated payment</div>' +
      '<div style="display:flex;align-items:baseline;gap:14px;margin:6px 0 10px">' +
      '<div class="countdown num">'+ndays+' <small>days</small></div>' +
      '<div><strong>'+nd.q+' due '+nd.label+'</strong><br><span class="sub">'+fmtDate(nd.date)+'</span></div></div>' +
      '<button class="btn btn-ghost btn-sm" data-goto="#/quarterly">Open calculator</button></div>' +

    '<div class="card"><div class="eyebrow">Safe to set aside · estimate</div>' +
      (setAside == null
        ? '<h3>—</h3><p class="sub">Enter your expected income and estimated tax % in the Quarterly calculator to see a set-aside estimate.</p><button class="btn btn-primary btn-sm" data-goto="#/quarterly">Set it up</button>'
        : '<div class="value display num" style="font-size:34px">'+money(setAside)+'</div>' +
          '<p class="sub">Estimated annual tax '+money(est)+' minus '+money(paid)+' already paid. Re-check as income changes.</p>') +
      '</div>' +

    '<div class="card"><div class="eyebrow">Readiness</div><h3>'+(cs.pct === 100 ? "Filing-ready" : cs.pct >= 60 ? "On track" : "Getting started")+'</h3>' +
      '<div class="progress-row"><div class="progress" style="flex:1"><i style="width:'+cs.pct+'%"></i></div>' +
      '<span class="pct num">'+cs.pct+'%</span></div>' +
      '<p class="sub" style="margin:10px 0 0">'+cs.done+' of '+cs.total+' prep tasks done.</p>' +
      '<button class="btn btn-ghost btn-sm" data-goto="#/checklist" style="margin-top:10px">Continue checklist</button></div>' +
  '</div>' + DISCLAIMER_HTML;
};
BIND.dashboard = function(){
  $$("#view [data-goto]").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.goto; }));
};

/* ================= VIEW 2 · Checklist ================= */
RENDER.checklist = function(){
  const cs = checklistStats();
  let html = '<div class="view-head"><div><h2>Tax Prep Checklist</h2>' +
    '<p>Work through each group, attach due dates, add your own tasks. Reset everything when a new tax year begins.</p></div>' +
    '<div class="btn-row" style="margin:0"><button class="btn btn-primary btn-sm" id="addTaskBtn">+ Add task</button>' +
    '<button class="btn btn-ghost btn-sm" id="resetYearBtn">Reset for new year</button></div></div>' +
    '<div class="card" style="margin-bottom:8px"><div class="progress-row" style="margin:0">' +
    '<div class="progress" style="flex:1"><i style="width:'+cs.pct+'%"></i></div>' +
    '<span class="pct num">'+cs.pct+'% · '+cs.done+'/'+cs.total+'</span></div></div>';
  for (const g of CHECKLIST_GROUPS){
    const items = DB.checklist.filter(t => t.group === g);
    const gd = items.filter(t => t.done).length;
    html += '<div class="group-title"><h3>'+esc(g)+'</h3><span class="count">'+gd+' / '+items.length+' done</span></div><div class="grid" style="gap:10px">';
    for (const t of items){
      html += '<div class="check'+(t.done?" done":"")+'" data-task="'+t.id+'" role="checkbox" aria-checked="'+t.done+'" tabindex="0">' +
        '<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1405" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></span>' +
        '<span class="t"><strong>'+esc(t.label)+'</strong>' +
        (t.custom ? '<small>custom task · </small>' : '') +
        (t.due ? '<small>due '+fmtDate(t.due)+'</small>' : '') + '</span>' +
        duePill(t.due) +
        (t.custom ? '<button class="mini-btn del" data-del="'+t.id+'" title="Delete task">✕</button>' : '') +
        '</div>';
    }
    html += '</div>';
  }
  return html + DISCLAIMER_HTML;
};
BIND.checklist = function(){
  $$("#view .check").forEach(el => {
    const toggle = ev => {
      if (ev.target.closest("[data-del]")) return;
      const t = DB.checklist.find(x => x.id === el.dataset.task);
      if (t){ t.done = !t.done; save(); render(); }
    };
    el.addEventListener("click", toggle);
    el.addEventListener("keydown", ev => { if (ev.key === " " || ev.key === "Enter"){ ev.preventDefault(); toggle(ev); } });
  });
  $$("#view [data-del]").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation();
    DB.checklist = DB.checklist.filter(x => x.id !== b.dataset.del);
    save(); render(); toast("Task deleted.");
  }));
  $("#addTaskBtn").addEventListener("click", () => {
    openModal('<h3>New task</h3><p class="sub">Add a custom step to your prep checklist.</p>' +
      '<div class="field"><label>Task</label><input class="input" id="ntLabel" placeholder="e.g. Scan last year\'s return"></div>' +
      '<div class="field"><label>Group</label><select class="input" id="ntGroup">' +
      CHECKLIST_GROUPS.map(g => '<option>'+esc(g)+'</option>').join("") + '</select></div>' +
      '<div class="field"><label>Due date <span class="opt">optional</span></label><input class="input" type="date" id="ntDue"></div>' +
      '<div class="btn-row"><button class="btn btn-primary" id="ntSave">Add task</button>' +
      '<button class="btn btn-ghost" id="ntCancel">Cancel</button></div>');
    $("#ntCancel").addEventListener("click", closeModal);
    $("#ntSave").addEventListener("click", () => {
      const label = $("#ntLabel").value.trim();
      if (!label){ toast("Give the task a name first."); return; }
      DB.checklist.push({id: uid(), group: $("#ntGroup").value, label, due: $("#ntDue").value || null, done: false, custom: true});
      save(); closeModal(); render(); toast("Task added.");
    });
  });
  $("#resetYearBtn").addEventListener("click", () => {
    openModal('<h3>Reset for a new year?</h3><p class="sub">This clears all checkmarks and moves due dates to the next tax year. ' +
      'Your deductions, mileage, payers and payments are kept.</p>' +
      '<div class="btn-row"><button class="btn btn-primary" id="ryYes">Reset checklist</button>' +
      '<button class="btn btn-ghost" id="ryNo">Cancel</button></div>');
    $("#ryNo").addEventListener("click", closeModal);
    $("#ryYes").addEventListener("click", () => {
      const Y = DB.settings.taxYear + 1;

  }
  html += '</div><div class="card"><div class="eyebrow">All entries</div>';
  if (!rows.length) html += '<div class="empty">No deductions yet — add your first one above.</div>';
  else {
    html += '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th class="r">Amount</th><th class="r">Biz %</th><th class="r">Deductible</th><th>Note</th><th>Receipt</th><th class="r">Actions</th></tr></thead><tbody>';
    for (const d of rows){
      const ded = Number(d.amount) * (Number(d.bizPct == null ? 100 : d.bizPct)) / 100;
      html += '<tr><td style="white-space:nowrap">'+fmtDate(d.date)+'</td><td style="text-transform:capitalize">'+esc(d.category)+'</td>' +
        '<td class="r num">'+money(d.amount)+'</td><td class="r num">'+esc(d.bizPct == null ? 100 : d.bizPct)+'%</td>' +
        '<td class="r num"><strong>'+money(ded)+'</strong></td>' +
        '<td style="max-width:220px">'+esc(d.note || "—")+'</td>' +
        '<td>'+(d.receipt ? '<img class="thumb" src="'+d.receipt+'" data-full="'+d.id+'" alt="receipt" title="Click to view">' : '<span style="color:var(--faint)">—</span>')+'</td>' +
        '<td><div class="row-actions"><button class="mini-btn" data-edit="'+d.id+'">Edit</button>' +
        '<button class="mini-btn del" data-rm="'+d.id+'">Delete</button></div></td></tr>';
    }
    html += '</tbody></table></div>';
  }
  return html + '</div>' + DISCLAIMER_HTML;
};
function catTotal(c){
  return DB.deductions.filter(d => d.category === c)
    .reduce((s,d) => s + Number(d.amount) * (Number(d.bizPct == null ? 100 : d.bizPct)) / 100, 0);
}
function topCategory(){
  let best = null, bv = 0;
  for (const c of CATEGORIES){ const t = catTotal(c); if (t > bv){ bv = t; best = c; } }
  return best;
}

/* ================= VIEW 8 · Year-End Report ================= */
function deductionsCSV(){
  const head = "Date,Category,Amount,BusinessUsePct,DeductibleAmount,Note";
  const lines = DB.deductions.map(d => {
    const ded = Number(d.amount) * (Number(d.bizPct == null ? 100 : d.bizPct)) / 100;
    return [d.date, d.category, Number(d.amount).toFixed(2), (d.bizPct == null ? 100 : d.bizPct), ded.toFixed(2),
      '"' + String(d.note || "").replace(/"/g, '""') + '"'].join(",");
  });
  return head + "\n" + lines.join("\n");
}
function mileageCSV(){
  const head = "Date,Miles,Purpose";
  const lines = DB.mileage.map(m =>
    [m.date, m.miles, '"' + String(m.purpose || "").replace(/"/g, '""') + '"'].join(","));
  return head + "\n" + lines.join("\n");
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime || "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ================= self-test (?qa=selftest) ================= */
function runSelfTest(){
  const results = [];
  const snap = JSON.stringify(DB);
  const ok = (name, cond, detail) => results.push({name, pass: !!cond, detail: detail || ""});
  try {
    /* 1. storage round-trip */
    save();
    const raw = localStorage.getItem(STORE_KEY);
    let parsed = null;
    try { parsed = JSON.parse(raw); } catch(e){}
    ok("Storage round-trip", !!(parsed && parsed.settings && Array.isArray(parsed.deductions)),
      parsed ? "key present, settings + deductions parsed" : "localStorage read failed");

    /* 2. view nav — every view renders non-empty, error-free */
    let navOk = true, navDetail = [];
    for (const v of VIEWS){
      try {
        const html = RENDER[v[0]]();
        if (!html || html.length < 200){ navOk = false; navDetail.push(v[0] + ":empty"); }
      } catch(e){ navOk = false; navDetail.push(v[0] + ":" + e.message); }
    }
    ok("All 9 views render", navOk, navOk ? "9/9 views produced markup" : navDetail.join("; "));

    /* 3. theme toggle flips + persists */
    const before = DB.settings.theme;
    const wasDark = (THEMES.find(t => t.id === before) || {}).dark;
    toggleDarkLight();
    const after = DB.settings.theme;
    const reloaded = JSON.parse(localStorage.getItem(STORE_KEY)).settings.theme;
    ok("Theme toggle flips & persists", after !== before && reloaded === after,
      before + " → " + after + " (stored: " + reloaded + ")");
    DB.settings.theme = before; save(); applySettings();

    /* 4. checklist toggle persists */
    const task = DB.checklist[0];
    const tBefore = task.done;
    task.done = !tBefore; save();
    const tAfter = JSON.parse(localStorage.getItem(STORE_KEY)).checklist[0].done;
    ok("Checklist toggle persists", tAfter === !tBefore, "done: " + tBefore + " → " + tAfter);
    task.done = tBefore;

    /* 5. CSV export produces content */
    const csv = deductionsCSV();
    ok("Deductions CSV has content", csv.indexOf("Date,Category,Amount") === 0 && csv.split("\n").length > 1,
      (csv.split("\n").length - 1) + " data rows, header present");
    const mcsv = mileageCSV();
    ok("Mileage CSV has content", mcsv.indexOf("Date,Miles,Purpose") === 0 && mcsv.split("\n").length > 1,
      (mcsv.split("\n").length - 1) + " data rows");

    /* 6. quarterly math uses user-entered % */
    DB.quarterly.income = 100000; DB.quarterly.pct = 25;
    const q = estimatedAnnualTax();
    ok("Quarterly estimate math", q === 25000 && Math.abs(q/4 - 6250) < 0.001,
      "100000 × 25% = " + q + ", quarterly = " + (q/4));

    /* 7. font switch applies to <html> */
    const fBefore = DB.settings.font;
    DB.settings.font = fBefore === "serif" ? "grotesk" : "serif";
    applySettings();
    const attr = document.documentElement.getAttribute("data-font");
    ok("Font switch applies", attr === DB.settings.font, "data-font=" + attr);
    DB.settings.font = fBefore; applySettings();

    /* 8. no hardcoded IRS rates: scan for suspicious literals is manual; verify disclaimer present */
    ok("Disclaimer present in views", DISCLAIMER_HTML.indexOf("not tax advice") > -1, "disclaimer string included");

    /* 9. deduction totals respect business-use % */
    const t2 = [{amount: 200, bizPct: 50}, {amount: 100, bizPct: 100}]
      .reduce((s,d) => s + Number(d.amount) * Number(d.bizPct) / 100, 0);
    ok("Business-use % math", t2 === 200, "200@50% + 100@100% = " + t2);
  } catch(e){
    results.push({name: "Self-test harness", pass: false, detail: "exception: " + e.message});
  }
  DB = JSON.parse(snap); save(); applySettings();

  const passed = results.filter(r => r.pass).length;
  const html = '<div class="view-head"><div><h2>Self-Test Results</h2>' +
    '<p>'+passed+' of '+results.length+' assertions passed. State was snapshotted and restored.</p></div>' +
    '<button class="btn btn-ghost btn-sm" id="qaBack">Back to app</button></div>' +
    '<div class="card"><div class="eyebrow">qa=selftest · ' + new Date().toLocaleString() + '</div>' +
    results.map(r => '<div class="test-row"><span class="badge '+(r.pass?"pass":"fail")+'">'+(r.pass?"PASS":"FAIL")+'</span>' +
      '<div><strong>'+esc(r.name)+'</strong><div class="detail">'+esc(r.detail)+'</div></div></div>').join("") +
    '</div>';
  $("#mainNav").style.display = "none";
  $("#view").innerHTML = html;
  $("#qaBack").addEventListener("click", () => { location.search = ""; });
  console.log("SELFTEST " + passed + "/" + results.length + " passed");
}

<script>
(function(){
  var DEMO_LIMIT = 10;
  var DEMO_MSG = "Demo limit reached (10 entries). Get the full version on Etsy for unlimited entries!";
  var addCount = 0;
  function isAddButton(el){
    if (!el || !el.textContent) return false;
    var t = el.textContent.trim().toLowerCase();
    if (t.indexOf('theme') > -1 || t.indexOf('font') > -1 || t.indexOf('mode') > -1) return false;
    var addWords = ['add', 'save', 'create'];
    for (var i = 0; i < addWords.length; i++){
      if (t === addWords[i] || t.indexOf(addWords[i]+' ') === 0) return true;
    }
    if (t === '+') return true;
    return false;
  }
  function showMsg(){
    try { if (typeof toast === 'function') toast(DEMO_MSG); else alert(DEMO_MSG); }
    catch(e){ alert(DEMO_MSG); }
  }
  function updateCounter(){
    var c = document.getElementById('demo-entry-counter');
    if (c) c.textContent = addCount + '/' + DEMO_LIMIT + ' entries used';
  }
  document.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('button,input[type="submit"],input[type="button"]') : null;
    if (!btn || !isAddButton(btn)) return;
    if (addCount >= DEMO_LIMIT) {
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      showMsg(); return false;
    }
    addCount++; updateCounter();
  }, true);
  document.addEventListener('submit', function(e){
    if (addCount >= DEMO_LIMIT) {
      e.preventDefault(); e.stopPropagation(); showMsg(); return false;
    }
    addCount++; updateCounter();
  }, true);
})();
</script>
